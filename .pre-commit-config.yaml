repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types: [python]
      - id: basedpyright
        name: basedpyright
        entry: uv run --no-sync basedpyright
        language: system
        types: [python]
        pass_filenames: false
